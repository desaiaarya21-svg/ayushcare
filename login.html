{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">🌿</div>
        <h1>Ayush Case-Taking</h1>
        <p class="subtitle">Doctor Login (Offline PIN)</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="pin">Enter 4-Digit PIN</label>
            <input type="password" id="pin" name="pin" maxlength="4" inputmode="numeric"
                   pattern="[0-9]*" autofocus required>
            <button type="submit">Login</button>
        </form>
        <p class="hint">New doctor? <a href="{{ url_for('doctor_register') }}">Register here</a></p>
        <p class="hint">Demo PIN: 1234 (Dr. Sharma)</p>
        <p class="hint"><a href="{{ url_for('index') }}">&larr; Back</a></p>
    </div>
</div>
{% endblock %}
