{% extends "base.html" %}
{% block title %}Request Edit{% endblock %}
{% block content %}

<h1 style="font-size:20px; color:var(--navy);">Request Info Edit</h1>
<p class="page-subtitle">{{ patient['name'] }} ({{ patient['patient_code'] }})</p>
<p style="font-size:13px; color:#888; margin-bottom:16px;">
    Changes here won't apply immediately — the patient must approve them from their own login first.
</p>

<form method="POST" class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ patient['name'] }}">
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" value="{{ patient['age'] or '' }}">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select name="gender">
                <option value="">No change</option>
                <option value="Male" {% if patient['gender']=='Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient['gender']=='Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient['gender']=='Other' %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Contact</label>
            <input type="text" name="contact" value="{{ patient['contact'] or '' }}">
        </div>
        <div class="form-group full-width">
            <label>Address</label>
            <textarea name="address" rows="2">{{ patient['address'] or '' }}</textarea>
        </div>
        <div class="form-group full-width">
            <label>Emergency Contact</label>
            <input type="text" name="emergency_contact" value="{{ patient['emergency_contact'] or '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Send Edit Request to Patient</button>
</form>

<a href="{{ url_for('patient_profile', patient_code=patient['patient_code']) }}" class="btn btn-secondary" style="margin-top:12px; display:inline-block;">
    Cancel
</a>
{% endblock %}
